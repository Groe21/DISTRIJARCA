<!-- 
    EJEMPLO DE INTEGRACIÓN PARA FRONTEND
    Agregar este código en frontend/index.html en la sección de productos
-->

<!-- Sección de Productos Destacados -->
<section id="productos" class="py-5 bg-light">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="section-title">Ofrecemos una amplia variedad de productos premium para tu negocio</h2>
        </div>
        
        <!-- Contenedor dinámico de secciones -->
        <div id="productos-destacados" class="row">
            <!-- Las secciones se cargarán aquí dinámicamente -->
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando productos...</span>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- JavaScript para cargar las secciones desde el API -->
<script>
// Configuración del API
const API_BASE_URL = 'http://localhost:8000/api'; // Cambiar en producción

// Función para cargar las secciones destacadas
async function cargarSeccionesDestacadas() {
    try {
        const response = await fetch(`${API_BASE_URL}/home/sections`);
        const data = await response.json();
        
        if (data.success && data.data.length > 0) {
            renderizarSecciones(data.data);
        } else {
            mostrarMensajeVacio();
        }
    } catch (error) {
        console.error('Error al cargar secciones:', error);
        mostrarMensajeError();
    }
}

// Función para renderizar las secciones
function renderizarSecciones(secciones) {
    const container = document.getElementById('productos-destacados');
    container.innerHTML = '';
    
    secciones.forEach(seccion => {
        const seccionHTML = `
            <div class="col-lg-3 col-md-6 mb-4" data-aos="fade-up" data-aos-delay="${seccion.id * 100}">
                <div class="card producto-card h-100 shadow-sm">
                    <!-- Imagen de la sección -->
                    <div class="position-relative overflow-hidden">
                        <img src="${seccion.imagen_url}" 
                             class="card-img-top producto-imagen" 
                             alt="${seccion.titulo}"
                             onerror="this.src='assets/placeholder-category.png'">
                        
                        <!-- Badge -->
                        ${seccion.badge.texto ? `
                            <span class="badge position-absolute top-0 end-0 m-3 bg-${seccion.badge.color}">
                                ${seccion.badge.texto}
                            </span>
                        ` : ''}
                    </div>
                    
                    <div class="card-body d-flex flex-column">
                        <!-- Ícono -->
                        <div class="icono-producto text-center mb-3">
                            <i class="${seccion.icono_class} fs-1 text-warning"></i>
                        </div>
                        
                        <!-- Título -->
                        <h3 class="card-title h5 fw-bold text-primary mb-3">
                            ${seccion.titulo}
                        </h3>
                        
                        <!-- Descripción -->
                        <p class="card-text text-muted mb-3">
                            ${seccion.descripcion}
                        </p>
                        
                        <!-- Lista de productos destacados -->
                        ${seccion.productos.length > 0 ? `
                            <ul class="lista-productos list-unstyled mb-3">
                                ${seccion.productos.slice(0, 3).map(producto => `
                                    <li class="mb-2">
                                        <i class="bi bi-check-circle text-success me-2"></i>
                                        <small>${producto.nombre}</small>
                                    </li>
                                `).join('')}
                            </ul>
                        ` : `
                            <p class="text-muted small">
                                <i class="bi bi-info-circle me-1"></i>
                                Próximamente productos destacados
                            </p>
                        `}
                        
                        <!-- Botón ver más (opcional) -->
                        <div class="mt-auto">
                            <a href="#${seccion.categoria.slug}" 
                               class="btn btn-outline-primary btn-sm w-100">
                                Ver más <i class="bi bi-arrow-right ms-2"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML += seccionHTML;
    });
    
    // Reinicializar animaciones AOS si está disponible
    if (typeof AOS !== 'undefined') {
        AOS.refresh();
    }
}

// Función para mostrar mensaje cuando no hay secciones
function mostrarMensajeVacio() {
    const container = document.getElementById('productos-destacados');
    container.innerHTML = `
        <div class="col-12 text-center py-5">
            <i class="bi bi-inbox display-1 text-muted mb-3"></i>
            <h4 class="text-muted">No hay secciones disponibles</h4>
            <p class="text-muted">Las secciones de productos se mostrarán aquí próximamente</p>
        </div>
    `;
}

// Función para mostrar mensaje de error
function mostrarMensajeError() {
    const container = document.getElementById('productos-destacados');
    container.innerHTML = `
        <div class="col-12 text-center py-5">
            <i class="bi bi-exclamation-triangle display-1 text-warning mb-3"></i>
            <h4 class="text-muted">Error al cargar las secciones</h4>
            <p class="text-muted">Por favor, intenta recargar la página</p>
            <button onclick="cargarSeccionesDestacadas()" class="btn btn-primary">
                <i class="bi bi-arrow-clockwise me-2"></i>Reintentar
            </button>
        </div>
    `;
}

// Cargar secciones al cargar la página
document.addEventListener('DOMContentLoaded', function() {
    cargarSeccionesDestacadas();
});

// Opcional: Recargar cada 5 minutos para tener datos frescos
// setInterval(cargarSeccionesDestacadas, 5 * 60 * 1000);
</script>

<!-- Estilos adicionales (agregar a styles.css) -->
<style>
.producto-card {
    transition: all 0.3s ease;
    border: none;
    border-radius: 12px;
    overflow: hidden;
}

    transform: translateY(-8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15) !important;
}

    height: 250px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.producto-card:hover .producto-imagen {
    transform: scale(1.1);
}

    width: 60px;
    height: 60px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #F9B233 0%, #F28E80 100%);
    border-radius: 50%;
    color: white;
}

.lista-productos li {
    font-size: 0.9rem;
    padding: 4px 0;
}

.lista-productos li:hover {
    color: #DA251D;
    cursor: pointer;
}

.badge {
    font-size: 0.75rem;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
}
</style>
